name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Node.js & Syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check JavaScript files
        run: |
          find src migrations -name "*.js" -exec node --check {} +

      - name: Run backend tests
        env:
          JWT_SECRET: ci_test_jwt_secret
        run: npm test

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Lint code with oxlint
        run: npm run lint

      - name: Build production bundle
        run: npm run build

  docker:
    name: Docker & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose configuration
        env:
          DB_USER: ci_test_user
          DB_PASSWORD: ci_test_password
          DB_NAME: ci_test_db
          JWT_SECRET: ci_test_jwt_secret
          CLIENT_URL: http://localhost:5173
        run: docker compose config

      - name: Build Backend Docker image
        run: docker build -t nexus-backend:ci ./backend

      - name: Build Frontend Docker image
        run: docker build -t nexus-frontend:ci ./frontend
